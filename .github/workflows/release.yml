name: Build and Release Universal DMG

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build, Test & Release Universal DMG
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Show macOS & Swift Toolchain Info
        run: |
          sw_vers
          swift --version
          xcodebuild -version || true

      - name: Validate Shell Scripts & Run Unit Tests
        run: |
          bash -n ghostmode_setup.sh
          bash -n make_icns.sh
          make clean
          make test

      - name: Build Universal App & DMG Installer
        run: |
          make dmg

      - name: Verify Universal Binary, Signature & Checksum
        run: |
          ARCHS=$(lipo -archs "Ghost Mode.app/Contents/MacOS/GhostMode")
          echo "Architectures: $ARCHS"
          echo "$ARCHS" | grep -q "arm64"
          echo "$ARCHS" | grep -q "x86_64"
          codesign --verify --deep --strict --verbose=2 "Ghost Mode.app"
          shasum -a 256 GhostMode-Installer.dmg > GhostMode-Installer.dmg.sha256
          cat GhostMode-Installer.dmg.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            GhostMode-Installer.dmg
            GhostMode-Installer.dmg.sha256
          name: "Ghost Mode ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
