name: Build and Release Universal DMG

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Universal macOS DMG
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode & Swift Version
        run: |
          xcodebuild -version
          swift --version

      - name: Build Universal App and DMG Installer
        run: |
          make clean
          make dmg

      - name: Verify Universal Binary
        run: |
          lipo -archs "Ghost Mode.app/Contents/MacOS/GhostMode"
          ls -la GhostMode-Installer.dmg

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: GhostMode-Installer.dmg
          name: "Ghost Mode ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
