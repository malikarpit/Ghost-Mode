name: "Feature Request"
description: Suggest an enhancement or new capability for Ghost Mode
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for sharing an idea to improve **Ghost Mode**!

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - "Session & Timers"
        - "Safety & Power / Thermal Guards"
        - "App Freeze / Whitelist / Audio Rules"
        - "Settings & System Integration"
        - "UI / UX & Menu Bar"
        - "Build / Packaging / CLI"
    validations:
      required: false

  - type: textarea
    id: problem
    attributes:
      label: Problem or Use Case
      description: What workflow or frustration does this solve?
      placeholder: When working with external displays or long builds...
    validations:
      required: false

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe how you envision this working cleanly in macOS.
      placeholder: It would help if Ghost Mode supported...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any workarounds or alternative designs you considered.
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: macOS version, hardware setup, or screenshots if relevant.
