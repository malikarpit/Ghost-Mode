name: "🐛 Bug Report"
description: File a bug report or issue with Ghost Mode
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the sections below to help us diagnose and fix it quickly.
  - type: input
    id: macos_version
    attributes:
      label: macOS Version
      description: e.g., macOS 14.4 Sonoma, macOS 15.0 Sequoia
      placeholder: macOS 14.x / 15.x
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Mac Model & Chip
      description: What hardware are you running on?
      options:
        - "Apple Silicon (M1 / M2 / M3 / M4)"
        - "Intel (64-bit)"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
      placeholder: When I close the lid with Ghost Mode active...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Open Ghost Mode
        2. Set timer for 30m
        3. Close laptop lid
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or Console Output (Optional)
      description: Run Ghost Mode from terminal (`/Applications/Ghost\ Mode.app/Contents/MacOS/GhostMode`) or paste any Console logs.
