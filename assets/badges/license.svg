<svg xmlns="http://www.w3.org/2000/svg" width="90" height="20" role="img" aria-label="License: MIT">
  <title>License: MIT</title>
  <linearGradient id="s" x2="0" y2="100%">
    <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
    <stop offset="1" stop-opacity=".1"/>
  </linearGradient>
  <clipPath id="r">
    <rect width="90" height="20" rx="3" fill="#fff"/>
  </clipPath>
  <g clip-path="url(#r)">
    <rect width="56" height="20" fill="#555"/>
    <rect x="56" width="34" height="20" fill="#DF9014"/>
    <rect width="90" height="20" fill="url(#s)"/>
  </g>
  <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="11">
    <text aria-hidden="true" x="28" y="15" fill="#010101" fill-opacity=".3" textLength="42">License</text>
    <text x="28" y="14" fill="#fff" textLength="42">License</text>
    <text aria-hidden="true" x="73" y="15" fill="#010101" fill-opacity=".3" textLength="20">MIT</text>
    <text x="73" y="14" fill="#fff" textLength="20">MIT</text>
  </g>
</svg>
